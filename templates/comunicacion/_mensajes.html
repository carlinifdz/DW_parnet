{% if messages %}
    <div class="comunicacion-mensajes" role="status" aria-live="polite">
        {% for message in messages %}
            <div class="alerta-comunicacion alerta-{{ message.tags|default:'info' }}">
                <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    </div>
{% endif %}
